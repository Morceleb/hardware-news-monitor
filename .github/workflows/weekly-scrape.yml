name: Weekly Hardware News

on:
  schedule:
    # 每周一 09:00（北京时间）→ UTC 01:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write          # 允许推送 gh-pages 分支
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 代码检查（ruff）
        run: ruff check scripts tests

      - name: 运行测试（pytest）
        run: pytest -q

      - name: 采集新闻
        run: python scripts/collect.py

      - name: 生成站点
        run: python scripts/build_site.py

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
